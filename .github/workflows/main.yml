
name: Build AntiGem Standard APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'app/**'
      - 'agy_ide_bridge/**'
      - 'scripts/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.json'
      - '.github/workflows/build-standard.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install xz
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Standard Debug APK
        run: ./gradlew --no-daemon assembleStandardDebug

      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-Debug-APK
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
