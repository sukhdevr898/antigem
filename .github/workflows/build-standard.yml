
name: Build AntiGem Standard APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'agy_ide_bridge/**'
      - 'scripts/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.json'
      - '.github/workflows/build-standard.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Standard APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3. Setup Go for Android IDE Bridge
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      # 4. Setup Android SDK without legacy tools package
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. Install required Android SDK
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. Install xz compression utility
      - name: Install xz
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      # 7. Validate build tools
      - name: Check build environment
        run: |
          java -version
          go version
          sdkmanager --list_installed
          xz --version

      # 8. Grant Gradle permission
      - name: Grant Gradle permission
        run: chmod +x gradlew

      # 9. Build AntiGem Standard Debug APK
      - name: Build Standard Debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleStandardDebug

      # 10. Verify APK
      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/standard/debug \
            -maxdepth 1 -name '*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"
          sha256sum "$APK"

      # 11. Upload APK artifact
      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-APK
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
